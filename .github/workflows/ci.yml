# WASS CI — test, vet, and a secret scan on every push/PR.
# Windows-dev note: `make` is not required here; CI runs the same commands.
# golangci-lint joins this workflow with M2 (docs/TASKS.md M2, D-010).
#
# The gitleaks job installs a pinned gitleaks and scans the FULL history on
# every run. It deliberately avoids gitleaks-action@v2, which scans only the
# push's diff range and crashes when that range is rooted at a parentless
# commit (any force-push of a fresh history — exactly what happened on the
# initial push; D-016). Full-history scanning is also strictly safer for a
# secret scanner.

name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22.x", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  gitleaks:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      # Keep in sync with the local dev install (docs/DECISIONS.md D-010).
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: the scan covers every commit
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan full git history
        run: gitleaks git . --redact --no-banner --exit-code 1 --report-format sarif --report-path results.sarif
      - name: Upload scan report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results.sarif
          path: results.sarif
